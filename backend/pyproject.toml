[project]
name = "ai-agent-platform-backend"
version = "0.1.0"
description = "Self-hosted AI Agent Platform backend (FastAPI + LangGraph + Deep Agents)"
authors = [{ name = "01danl" }]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "deepagents>=0.7.31",
    "email-validator>=2.3.0",
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "langchain-openai>=1.7.2",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "langgraph[sqlite]>=1.2.16",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pypdf>=6.21.2",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.6",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
