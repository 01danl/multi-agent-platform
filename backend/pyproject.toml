[project]
name = "ai-agent-platform-backend"
version = "0.1.0"
description = "Self-hosted AI Agent Platform backend (FastAPI + LangGraph + Deep Agents)"
authors = [{ name = "01danl" }]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "deepagents>=0.7.31",
    "email-validator>=2.3.0",
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "langchain-openai>=1.7.2",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "langgraph[sqlite]>=1.2.16",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
