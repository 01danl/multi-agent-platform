services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    environment:
      # Secrets come from the host environment or a local .env file — never baked into images.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CUSTOM_OPENAI_BASE_URL: ${CUSTOM_OPENAI_BASE_URL:-}
      CUSTOM_OPENAI_API_KEY: ${CUSTOM_OPENAI_API_KEY:-}
      OPENAI_MODELS: ${OPENAI_MODELS:-}
      OPENROUTER_MODELS: ${OPENROUTER_MODELS:-}
      SECRET_KEY: ${SECRET_KEY:-please-change-me}
      DEBUG: ${DEBUG:-false}
      # Deterministic provider without external calls; enable for demos/tests only.
      FAKE_PROVIDER_ENABLED: ${FAKE_PROVIDER_ENABLED:-false}
    volumes:
      - platform-data:/app/data
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  platform-data:
